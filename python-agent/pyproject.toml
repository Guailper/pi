[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-agent-py"
version = "0.1.0"
description = "A compact Python reimplementation of Pi's stateful agent runtime"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Guailper"}]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
test = ["pytest>=8.0"]

[project.scripts]
pi-agent-py = "pi_agent_py.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pi_agent_py*"]
